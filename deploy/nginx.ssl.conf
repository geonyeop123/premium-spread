# Premium Spread — SSL 적용 nginx 설정 템플릿
# Let's Encrypt 인증서 발급 후 사용한다 (README 5단계 참조).
#   sed 's/__DOMAIN__/your.domain.com/g' deploy/nginx.ssl.conf > docker/nginx/nginx.conf
#   docker compose -f docker/app-compose.yml restart nginx
#
# ⚠️ api prd 프로파일은 세션 쿠키가 secure=true; same-site=strict 이므로
#    HTTPS 없이는 로그인/세션이 동작하지 않는다 → SSL은 사실상 필수.

upstream api { server api:8080; }
upstream web { server web:3000; }

# HTTP: ACME 챌린지만 처리하고 나머지는 HTTPS로 리다이렉트
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
