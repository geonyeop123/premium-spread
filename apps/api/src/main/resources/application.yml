server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: api
  config:
    import:
      - jpa.yml
      - redis.yml
  flyway:
    enabled: true

jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:}
  audience: ${JWT_AUDIENCE:}
  access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:}
  refresh-token-expiry-ms: ${JWT_REFRESH_TOKEN_EXPIRY_MS:}
  clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:}

auth:
  cookie:
    name: ${AUTH_COOKIE_NAME:refresh_token}
    path: ${AUTH_COOKIE_PATH:/api/v1/auth}
    domain: ${AUTH_COOKIE_DOMAIN:}
    secure: ${AUTH_COOKIE_SECURE:}
    http-only: true
    same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:}
    allowed-methods: [GET, POST, PATCH, DELETE, OPTIONS]
    allowed-headers: [Content-Type, Authorization]
    allow-credentials: true
  refresh:
    hmac-key: ${AUTH_REFRESH_HMAC_KEY:}
    concurrent-grace-ms: ${AUTH_REFRESH_CONCURRENT_GRACE_MS:2000}
    key-prefix: ${AUTH_REFRESH_KEY_PREFIX:auth:refresh}

migration:
  v12:
    allow-empty-position-migration: ${MIGRATION_V12_ALLOW_EMPTY:false}

aggregation:
  zone: ${AGGREGATION_ZONE:Asia/Seoul}

management:
  prometheus:
    metrics:
      export:
        enabled: true
  server:
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

warmup:
  enabled: true
  symbols:
    - btc
  exchanges:
    - exchange: bithumb
      symbol: btc
    - exchange: binance
      symbol: btc

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local

jwt:
  secret-key: ${JWT_SECRET_KEY:default-local-secret-key-must-be-at-least-32-bytes-long!!}
  issuer: ${JWT_ISSUER:premium-spread-local}
  audience: ${JWT_AUDIENCE:premium-spread-api-local}
  access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:1800000}
  refresh-token-expiry-ms: ${JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}
  clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:30}

auth:
  cookie:
    secure: false
  cors:
    allowed-origins:
      - ${AUTH_CORS_ALLOWED_ORIGIN:http://localhost:3000}
  refresh:
    hmac-key: ${AUTH_REFRESH_HMAC_KEY:default-local-refresh-hmac-key-must-be-32-bytes!!}

---
spring:
  config:
    activate:
      on-profile: test

jwt:
  secret-key: test-secret-key-must-be-at-least-32-bytes-long!!
  issuer: premium-spread-test
  audience: premium-spread-api-test
  access-token-expiry-ms: 1800000
  refresh-token-expiry-ms: 604800000
  clock-skew-seconds: 30

auth:
  cookie:
    secure: false
  cors:
    allowed-origins:
      - http://localhost:3000
  refresh:
    hmac-key: test-refresh-hmac-key-must-be-at-least-32-bytes!!

migration:
  v12:
    allow-empty-position-migration: true

warmup:
  enabled: false

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
