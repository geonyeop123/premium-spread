spring:
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_MASTER_HOST}
      port: ${REDIS_MASTER_PORT}

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict

auth:
  cookie:
    secure: true
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:}

alert:
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}

logging:
  level:
    root: INFO
    io.premiumspread: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
