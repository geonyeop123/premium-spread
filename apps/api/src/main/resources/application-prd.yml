spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/premiumspread?useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PWD}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_MASTER_HOST}
      port: ${REDIS_MASTER_PORT}

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict

alert:
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}

logging:
  level:
    root: INFO
    io.premiumspread: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
