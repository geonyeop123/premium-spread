server:
  port: 8081

spring:
  application:
    name: premium-spread-batch
  config:
    import:
      - jpa.yml
      - redis.yml
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# External API 설정
exchange-rate:
  api-key: ${EXCHANGE_RATE_API_KEY}

# 시세 수집 모드 (rest | websocket) — Phase 2/3 토글
premium:
  ingestion:
    binance:
      mode: rest
    bithumb:
      mode: rest

# 사용자 알림 (이슈 #27)
# ALERT_EMAIL_FROM 환경변수가 설정될 때만 PremiumThresholdNotificationService/Listener가 활성화된다.
# 미설정 시 알림 빈은 등록되지 않음 (@ConditionalOnProperty 가드).
alert:
  email:
    from: ${ALERT_EMAIL_FROM:}

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    io.premiumspread: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  main:
    allow-bean-definition-overriding: true

scheduling:
  enabled: false

redis:
  enabled: false

exchange-rate:
  api-key: test-dummy-key
