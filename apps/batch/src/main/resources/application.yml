server:
  port: 8081

spring:
  application:
    name: premium-spread-batch
  config:
    import:
      - jpa.yml
      - redis.yml
  flyway:
    enabled: false

# Scheduler trigger 설정
batch:
  market:
    symbol: ${BATCH_MARKET_SYMBOL:BTC}
    korea-exchange: ${BATCH_KOREA_EXCHANGE:BITHUMB}
    korea-quote: ${BITHUMB_MARKET_QUOTE:KRW}
    foreign-exchange: ${BATCH_FOREIGN_EXCHANGE:BINANCE}
    foreign-quote: ${BINANCE_MARKET_QUOTE:USD}
    fx-base: ${EXCHANGE_RATE_BASE:USD}
    fx-quote: ${EXCHANGE_RATE_QUOTE:KRW}
  scheduling:
    enabled: ${BATCH_SCHEDULING_ENABLED:true}
    binance-flush:
      fixed-rate: ${BINANCE_FLUSH_FIXED_RATE:1s}
    bithumb-flush:
      fixed-rate: ${BITHUMB_FLUSH_FIXED_RATE:1s}
    exchange-rate:
      fixed-rate: ${EXCHANGE_RATE_FIXED_RATE:30m}
      startup-delay: ${EXCHANGE_RATE_STARTUP_DELAY:5s}
    premium:
      fixed-rate: ${PREMIUM_FIXED_RATE:1s}
    premium-aggregation:
      summary-fixed-rate: ${PREMIUM_SUMMARY_FIXED_RATE:10s}
      minute-cron: ${PREMIUM_MINUTE_CRON:0 * * * * *}
      hour-cron: ${PREMIUM_HOUR_CRON:5 0 * * * *}
      day-cron: ${PREMIUM_DAY_CRON:10 0 0 * * *}
    ticker-aggregation:
      minute-cron: ${TICKER_MINUTE_CRON:2 * * * * *}
      hour-cron: ${TICKER_HOUR_CRON:7 0 * * * *}
      day-cron: ${TICKER_DAY_CRON:12 0 0 * * *}
    trade-preparation-evaluation:
      fixed-rate: ${TRADE_PREPARATION_EVALUATION_FIXED_RATE:1s}
    trade-preparation-reconcile:
      fixed-rate: ${TRADE_PREPARATION_RECONCILE_FIXED_RATE:1m}
    account-pnl-monitor:
      fixed-rate: ${ACCOUNT_PNL_MONITOR_FIXED_RATE:60000}
    zone: ${AGGREGATION_ZONE:Asia/Seoul}
  jobs:
    fx-ingestion: { lock-key: "${FX_JOB_LOCK_KEY:lock:fx}", lease: "${FX_JOB_LEASE:35s}", execution-timeout: "${FX_JOB_TIMEOUT:30s}" }
    premium-realtime: { lock-key: "${PREMIUM_JOB_LOCK_KEY:lock:premium}", lease: "${PREMIUM_JOB_LEASE:5s}", execution-timeout: "${PREMIUM_JOB_TIMEOUT:3s}" }
    premium-summary: { lock-key: "${PREMIUM_SUMMARY_LOCK_KEY:lock:aggregation:summary}", lease: "${PREMIUM_SUMMARY_LEASE:30s}", execution-timeout: "${PREMIUM_SUMMARY_TIMEOUT:20s}" }
    premium-minute: { lock-key: "${PREMIUM_MINUTE_LOCK_KEY:lock:aggregation:minute}", lease: "${PREMIUM_MINUTE_LEASE:30s}", execution-timeout: "${PREMIUM_MINUTE_TIMEOUT:20s}" }
    premium-hour: { lock-key: "${PREMIUM_HOUR_LOCK_KEY:lock:aggregation:hour}", lease: "${PREMIUM_HOUR_LEASE:60s}", execution-timeout: "${PREMIUM_HOUR_TIMEOUT:45s}" }
    premium-day: { lock-key: "${PREMIUM_DAY_LOCK_KEY:lock:aggregation:day}", lease: "${PREMIUM_DAY_LEASE:120s}", execution-timeout: "${PREMIUM_DAY_TIMEOUT:90s}" }
    ticker-minute: { lock-key: "${TICKER_MINUTE_LOCK_KEY:lock:ticker:aggregation:minute}", lease: "${TICKER_MINUTE_LEASE:30s}", execution-timeout: "${TICKER_MINUTE_TIMEOUT:20s}" }
    ticker-hour: { lock-key: "${TICKER_HOUR_LOCK_KEY:lock:ticker:aggregation:hour}", lease: "${TICKER_HOUR_LEASE:60s}", execution-timeout: "${TICKER_HOUR_TIMEOUT:45s}" }
    ticker-day: { lock-key: "${TICKER_DAY_LOCK_KEY:lock:ticker:aggregation:day}", lease: "${TICKER_DAY_LEASE:120s}", execution-timeout: "${TICKER_DAY_TIMEOUT:90s}" }
    binance-flush: { lock-key: "${BINANCE_FLUSH_LOCK_KEY:lock:ticker:flush:binance}", lease: "${BINANCE_FLUSH_LEASE:5s}", execution-timeout: "${BINANCE_FLUSH_TIMEOUT:3s}" }
    bithumb-flush: { lock-key: "${BITHUMB_FLUSH_LOCK_KEY:lock:ticker:flush:bithumb}", lease: "${BITHUMB_FLUSH_LEASE:5s}", execution-timeout: "${BITHUMB_FLUSH_TIMEOUT:3s}" }
    trade-preparation-evaluation: { lock-key: "${TRADE_PREP_EVALUATION_LOCK_KEY:lock:trade-preparation:evaluation}", lease: "${TRADE_PREP_EVALUATION_LEASE:5s}", execution-timeout: "${TRADE_PREP_EVALUATION_TIMEOUT:3s}" }
    trade-preparation-reconcile: { lock-key: "${TRADE_PREP_RECONCILE_LOCK_KEY:lock:trade-preparation:reconcile}", lease: "${TRADE_PREP_RECONCILE_LEASE:30s}", execution-timeout: "${TRADE_PREP_RECONCILE_TIMEOUT:20s}" }

    account-pnl-monitor: { lock-key: "${ACCOUNT_PNL_MONITOR_LOCK_KEY:lock:account-pnl:monitor}", lease: "${ACCOUNT_PNL_MONITOR_LEASE:50s}", execution-timeout: "${ACCOUNT_PNL_MONITOR_TIMEOUT:40s}" }

# 실계정 순손익 알림 (기본 꺼짐). credential 은 환경변수로만 주입하며 기본값을 두지 않는다.
account-pnl-monitor:
  enabled: ${ACCOUNT_PNL_MONITOR_ENABLED:false}
  recipient: ${ACCOUNT_PNL_ALERT_RECIPIENT:}
  hourly-report:
    enabled: ${ACCOUNT_PNL_HOURLY_REPORT_ENABLED:true}
  bithumb:
    access-key: ${BITHUMB_ACCESS_KEY:}
    secret-key: ${BITHUMB_SECRET_KEY:}
  binance:
    mode: ${BINANCE_MODE:api}
    api-key: ${BINANCE_API_KEY:}
    secret-key: ${BINANCE_SECRET_KEY:}
    manual:
      short-quantity: ${BINANCE_MANUAL_SHORT_QUANTITY:}
      entry-price: ${BINANCE_MANUAL_ENTRY_PRICE:}
      entry-fee-usdt: ${BINANCE_MANUAL_ENTRY_FEE_USDT:}
      funding-usdt: ${BINANCE_MANUAL_FUNDING_USDT:}
      taker-fee-rate: ${BINANCE_MANUAL_TAKER_FEE_RATE:}

# owner 알림 채널 (메일·Discord). webhook URL 은 비밀값 — 환경변수로만 주입하며 기본값을 두지 않는다.
# 메일 수신 주소는 account-pnl-monitor.recipient (ACCOUNT_PNL_ALERT_RECIPIENT) — 메일 채널을 쓸 때만 필수.
owner-alert:
  email:
    enabled: ${OWNER_ALERT_EMAIL_ENABLED:true}
  discord:
    enabled: ${OWNER_ALERT_DISCORD_ENABLED:false}
    webhook:
      pnl: ${OWNER_ALERT_DISCORD_WEBHOOK_PNL:}
      market: ${OWNER_ALERT_DISCORD_WEBHOOK_MARKET:}
      ops: ${OWNER_ALERT_DISCORD_WEBHOOK_OPS:}
  # 알림 종류별 경로 덮어쓰기. 빈 값이면 Domain OwnerAlertKind 기본값. 종류를 추가하면 여기 세 줄과 runbook 을 함께 추가한다.
  routes:
    profit:
      email: ${OWNER_ALERT_PROFIT_EMAIL:}
      discord: ${OWNER_ALERT_PROFIT_DISCORD:}
      push: ${OWNER_ALERT_PROFIT_PUSH:}
    hourly-report:
      email: ${OWNER_ALERT_HOURLY_REPORT_EMAIL:}
      discord: ${OWNER_ALERT_HOURLY_REPORT_DISCORD:}
      push: ${OWNER_ALERT_HOURLY_REPORT_PUSH:}
    monitoring-outage:
      email: ${OWNER_ALERT_MONITORING_OUTAGE_EMAIL:}
      discord: ${OWNER_ALERT_MONITORING_OUTAGE_DISCORD:}
      push: ${OWNER_ALERT_MONITORING_OUTAGE_PUSH:}
    monitoring-recovered:
      email: ${OWNER_ALERT_MONITORING_RECOVERED_EMAIL:}
      discord: ${OWNER_ALERT_MONITORING_RECOVERED_DISCORD:}
      push: ${OWNER_ALERT_MONITORING_RECOVERED_PUSH:}
    position-changed:
      email: ${OWNER_ALERT_POSITION_CHANGED_EMAIL:}
      discord: ${OWNER_ALERT_POSITION_CHANGED_DISCORD:}
      push: ${OWNER_ALERT_POSITION_CHANGED_PUSH:}
    net-percent-swing:
      email: ${OWNER_ALERT_NET_PERCENT_SWING_EMAIL:}
      discord: ${OWNER_ALERT_NET_PERCENT_SWING_DISCORD:}
      push: ${OWNER_ALERT_NET_PERCENT_SWING_PUSH:}
    unrecovered-reminder:
      email: ${OWNER_ALERT_UNRECOVERED_REMINDER_EMAIL:}
      discord: ${OWNER_ALERT_UNRECOVERED_REMINDER_DISCORD:}
      push: ${OWNER_ALERT_UNRECOVERED_REMINDER_PUSH:}

# 거래 준비 조건 평가 (design.md D14) — 값의 근거는 수집 계약의 10초 중단 규칙이다.
trade-preparation:
  evaluation:
    max-age: ${TRADE_PREPARATION_EVALUATION_MAX_AGE:10s}

# External market stream 및 FX API 설정
market-streams:
  connection:
    first-message-timeout: ${MARKET_STREAM_FIRST_MESSAGE_TIMEOUT:5s}
    idle-timeout: ${MARKET_STREAM_IDLE_TIMEOUT:60s}
    initial-backoff: ${MARKET_STREAM_INITIAL_BACKOFF:1s}
    max-backoff: ${MARKET_STREAM_MAX_BACKOFF:30s}
    watchdog-interval: ${MARKET_STREAM_WATCHDOG_INTERVAL:5s}
  binance:
    endpoint: ${BINANCE_WS_ENDPOINT:wss://fstream.binance.com/public/ws/btcusdt@bookTicker}
    symbol: ${BATCH_MARKET_SYMBOL:BTC}
    quote: ${BINANCE_STREAM_QUOTE:USDT}
  bithumb:
    endpoint: ${BITHUMB_WS_ENDPOINT:wss://pubwss.bithumb.com/pub/ws}
    symbol: ${BATCH_MARKET_SYMBOL:BTC}
    quote: ${BITHUMB_MARKET_QUOTE:KRW}

exchange-rate:
  endpoint: ${EXCHANGE_RATE_ENDPOINT:https://v6.exchangerate-api.com}
  api-key: ${EXCHANGE_RATE_API_KEY}
  base: ${EXCHANGE_RATE_BASE:USD}
  quote: ${EXCHANGE_RATE_QUOTE:KRW}
  connect-timeout: ${EXCHANGE_RATE_CONNECT_TIMEOUT:2s}
  read-timeout: ${EXCHANGE_RATE_READ_TIMEOUT:3s}
  max-retries: ${EXCHANGE_RATE_MAX_RETRIES:3}
  initial-backoff: ${EXCHANGE_RATE_INITIAL_BACKOFF:250ms}
  max-backoff: ${EXCHANGE_RATE_MAX_BACKOFF:2s}

aggregation:
  zone: ${AGGREGATION_ZONE:Asia/Seoul}

notification:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    from: ${ALERT_EMAIL_FROM:}
    smtp:
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:0}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      connect-timeout: ${MAIL_CONNECT_TIMEOUT:3s}
      read-timeout: ${MAIL_READ_TIMEOUT:10s}
      write-timeout: ${MAIL_WRITE_TIMEOUT:10s}
  delivery:
    poll-interval: ${NOTIFICATION_DELIVERY_POLL_INTERVAL:5s}
    batch-size: ${NOTIFICATION_DELIVERY_BATCH_SIZE:10}
    concurrency: ${NOTIFICATION_DELIVERY_CONCURRENCY:2}
    hard-send-deadline: ${NOTIFICATION_DELIVERY_HARD_SEND_DEADLINE:30s}
    db-queue-safety-margin: ${NOTIFICATION_DELIVERY_DB_SAFETY_MARGIN:30s}
    stale-threshold: ${NOTIFICATION_DELIVERY_STALE_THRESHOLD:5m}
    max-attempts: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:5}
    retry-delays: ${NOTIFICATION_DELIVERY_RETRY_DELAYS:1m,5m,30m,2h}
    retry-jitter-ratio: ${NOTIFICATION_DELIVERY_RETRY_JITTER_RATIO:0.1}
    cooldown-window: ${NOTIFICATION_DELIVERY_COOLDOWN_WINDOW:1h}
    scrub-retention: ${NOTIFICATION_DELIVERY_SCRUB_RETENTION:30d}
    scrub-interval: ${NOTIFICATION_DELIVERY_SCRUB_INTERVAL:1h}
    scrub-batch-size: ${NOTIFICATION_DELIVERY_SCRUB_BATCH_SIZE:100}
    scrub-max-batches-per-run: ${NOTIFICATION_DELIVERY_SCRUB_MAX_BATCHES_PER_RUN:100}

# Actuator 설정
management:
  prometheus:
    metrics:
      export:
        enabled: true
  server:
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Logging
logging:
  level:
    root: INFO
    io.premiumspread: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  main:
    allow-bean-definition-overriding: true

batch:
  scheduling:
    enabled: false

redis:
  enabled: true

exchange-rate:
  api-key: test-dummy-key
