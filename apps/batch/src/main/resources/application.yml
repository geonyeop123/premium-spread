server:
  port: 8081

spring:
  application:
    name: premium-spread-batch
  config:
    import:
      - jpa.yml
      - redis.yml

# External API 설정
exchange-rate:
  api-key: ${EXCHANGE_RATE_API_KEY}

# 시세 수집 모드 (rest | websocket)
premium:
  ingestion:
    binance:
      mode: rest
    bithumb:
      mode: rest

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    io.premiumspread: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  main:
    allow-bean-definition-overriding: true

scheduling:
  enabled: false

redis:
  enabled: false

exchange-rate:
  api-key: test-dummy-key
