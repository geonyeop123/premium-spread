server:
  port: 8081

spring:
  application:
    name: premium-spread-batch
  config:
    import:
      - jpa.yml
      - redis.yml
  flyway:
    enabled: false

# External API 설정
exchange-rate:
  api-key: ${EXCHANGE_RATE_API_KEY}

aggregation:
  zone: ${AGGREGATION_ZONE:Asia/Seoul}

notification:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    from: ${ALERT_EMAIL_FROM:}
    smtp:
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:0}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}

# Actuator 설정
management:
  server:
    port: ${MANAGEMENT_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Logging
logging:
  level:
    root: INFO
    io.premiumspread: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  main:
    allow-bean-definition-overriding: true

scheduling:
  enabled: false

redis:
  enabled: true

exchange-rate:
  api-key: test-dummy-key
