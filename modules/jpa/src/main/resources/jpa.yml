spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Testcontainers/dynamic properties override these values. prd startup validation rejects
    # every local/default fallback, while an unprofiled developer context remains bootable.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/premiumspread?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER:application}
    password: ${MYSQL_PWD:application}
    hikari:
      pool-name: mysql-main-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:2000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:0}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:0}
      initialization-fail-timeout: ${DB_POOL_INITIALIZATION_FAIL_TIMEOUT_MS:1}
      data-source-properties:
        rewriteBatchedStatements: true
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        timezone.default_storage: NORMALIZE_UTC
        jdbc.time_zone: UTC

---
spring.config.activate.on-profile: local

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/premiumspread?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: application
    password: application
  # ddl-auto 는 공통 validate 를 상속한다. schema 정본은 Flyway 다 — create-drop 이면 bootRun 마다
  # 공용 로컬 DB 의 entity table 이 지워지고 Hibernate DDL 로 다시 만들어진다(Flyway 제약·index 소실).
  jpa:
    show-sql: true

---
spring.config.activate.on-profile: test

spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop

---
spring.config.activate.on-profile: dev

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/premiumspread?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: application
    password: application
  jpa:
    show-sql: false

---
spring.config.activate.on-profile: qa

---
spring.config.activate.on-profile: prd
