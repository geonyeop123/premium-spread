name: Deploy verified commit images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify application and deployment contracts
        run: |
          ./gradlew test --no-daemon
          ./gradlew :infrastructure:common:verifyMigrations \
            :infrastructure:common:integrationTest \
            :apps:api:integrationTest \
            :apps:batch:integrationTest --no-daemon
          bash docker/deploy-contract-test.sh

  publish-images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component: [api, batch, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable commit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # 서버는 source checkout/build를 하지 않는다. 검증된 SHA의 deploy bundle만 전송한다.
      - name: Upload deployment bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker/app-compose.yml,docker/infra-compose.yml,docker/preflight-v12.sh,docker/deploy.sh,docker/nginx/nginx.conf
          target: /home/ec2-user/premium-spread
          overwrite: true

      - name: Deploy exact image SHA with automatic rollback
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
          IMAGE_REGISTRY: ghcr.io
          IMAGE_NAMESPACE: ${{ github.repository }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PWD: ${{ secrets.MYSQL_PWD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_ACCESS_TOKEN_EXPIRY_MS: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRY_MS }}
          JWT_REFRESH_TOKEN_EXPIRY_MS: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRY_MS }}
          JWT_CLOCK_SKEW_SECONDS: ${{ secrets.JWT_CLOCK_SKEW_SECONDS }}
          AUTH_REFRESH_HMAC_KEY: ${{ secrets.AUTH_REFRESH_HMAC_KEY }}
          AUTH_CORS_ALLOWED_ORIGINS: ${{ secrets.AUTH_CORS_ALLOWED_ORIGINS }}
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          NOTIFICATION_EMAIL_ENABLED: ${{ vars.NOTIFICATION_EMAIL_ENABLED || 'false' }}
          MIGRATION_V12_ALLOW_EMPTY: ${{ vars.MIGRATION_V12_ALLOW_EMPTY || 'false' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_SHA,IMAGE_REGISTRY,IMAGE_NAMESPACE,REGISTRY_USERNAME,REGISTRY_TOKEN,MYSQL_ROOT_PASSWORD,MYSQL_USER,MYSQL_PWD,REDIS_PASSWORD,JWT_SECRET_KEY,JWT_ISSUER,JWT_AUDIENCE,JWT_ACCESS_TOKEN_EXPIRY_MS,JWT_REFRESH_TOKEN_EXPIRY_MS,JWT_CLOCK_SKEW_SECONDS,AUTH_REFRESH_HMAC_KEY,AUTH_CORS_ALLOWED_ORIGINS,EXCHANGE_RATE_API_KEY,SLACK_WEBHOOK_URL,MAIL_HOST,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,ALERT_EMAIL_FROM,NOTIFICATION_EMAIL_ENABLED,MIGRATION_V12_ALLOW_EMPTY
          script: |
            set -euo pipefail
            cd /home/ec2-user/premium-spread
            printf '%s' "${REGISTRY_TOKEN}" | docker login "${IMAGE_REGISTRY}" --username "${REGISTRY_USERNAME}" --password-stdin
            bash docker/deploy.sh
            docker logout "${IMAGE_REGISTRY}"
