name: Deploy quality-gated main SHA

on:
  workflow_run:
    workflows: [Quality Gate]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
  TARGET_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  publish-images:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component: [api, batch, web]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Verify exact deploy SHA
        run: bash ci/verify-target-sha.sh
      - name: Download candidate-bound image archives from the successful gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-images-${{ env.DEPLOY_SHA }}
          path: ${{ runner.temp }}/docker-images
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and publish the exact verified image archive
        run: |
          archive="${RUNNER_TEMP}/docker-images/${{ matrix.component }}.tar"
          image="ghcr.io/${GITHUB_REPOSITORY}/${{ matrix.component }}:${DEPLOY_SHA}"
          test -f "${archive}"
          docker load --input "${archive}"
          docker image inspect "${image}" >/dev/null
          docker push "${image}"

  deploy:
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Verify exact deploy SHA
        run: bash ci/verify-target-sha.sh

      - name: Upload deployment bundle
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker/app-compose.yml,docker/infra-compose.yml,docker/preflight-v12.sh,docker/deploy.sh,docker/nginx/nginx.conf
          target: /home/ec2-user/premium-spread
          overwrite: true

      - name: Deploy exact image SHA with automatic rollback
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          IMAGE_REGISTRY: ghcr.io
          IMAGE_NAMESPACE: ${{ github.repository }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PWD: ${{ secrets.MYSQL_PWD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_ACCESS_TOKEN_EXPIRY_MS: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRY_MS }}
          JWT_REFRESH_TOKEN_EXPIRY_MS: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRY_MS }}
          JWT_CLOCK_SKEW_SECONDS: ${{ secrets.JWT_CLOCK_SKEW_SECONDS }}
          AUTH_REFRESH_HMAC_KEY: ${{ secrets.AUTH_REFRESH_HMAC_KEY }}
          AUTH_CORS_ALLOWED_ORIGINS: ${{ secrets.AUTH_CORS_ALLOWED_ORIGINS }}
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          NOTIFICATION_EMAIL_ENABLED: ${{ vars.NOTIFICATION_EMAIL_ENABLED || 'false' }}
          MIGRATION_V12_ALLOW_EMPTY: ${{ vars.MIGRATION_V12_ALLOW_EMPTY || 'false' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_SHA,IMAGE_REGISTRY,IMAGE_NAMESPACE,REGISTRY_USERNAME,REGISTRY_TOKEN,MYSQL_ROOT_PASSWORD,MYSQL_USER,MYSQL_PWD,REDIS_PASSWORD,JWT_SECRET_KEY,JWT_ISSUER,JWT_AUDIENCE,JWT_ACCESS_TOKEN_EXPIRY_MS,JWT_REFRESH_TOKEN_EXPIRY_MS,JWT_CLOCK_SKEW_SECONDS,AUTH_REFRESH_HMAC_KEY,AUTH_CORS_ALLOWED_ORIGINS,EXCHANGE_RATE_API_KEY,SLACK_WEBHOOK_URL,MAIL_HOST,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,ALERT_EMAIL_FROM,NOTIFICATION_EMAIL_ENABLED,MIGRATION_V12_ALLOW_EMPTY
          script: |
            set -euo pipefail
            cd /home/ec2-user/premium-spread
            printf '%s' "${REGISTRY_TOKEN}" | docker login "${IMAGE_REGISTRY}" --username "${REGISTRY_USERNAME}" --password-stdin
            bash docker/deploy.sh
            docker logout "${IMAGE_REGISTRY}"
