name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.sha }}
  cancel-in-progress: true

jobs:
  compile-architecture:
    name: 1. Compile + architecture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate dependency bootstrap request
        id: bootstrap-request
        run: bash ci/check-dependency-bootstrap-request.sh "${GITHUB_OUTPUT}"
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          cache-disabled: ${{ steps.bootstrap-request.outputs.requested == 'true' }}
      - name: Generate dependency locks and SHA-256 metadata for review
        if: steps.bootstrap-request.outputs.requested == 'true'
        run: bash ci/generate-dependency-bootstrap.sh build/reports/dependency-bootstrap-review
      - name: Publish dependency bootstrap review bundle
        if: steps.bootstrap-request.outputs.requested == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-bootstrap-review-${{ github.sha }}
          path: build/reports/dependency-bootstrap-review/**
          if-no-files-found: error
          retention-days: 14
      - name: Require dependency bootstrap review and marker removal
        if: steps.bootstrap-request.outputs.requested == 'true'
        run: |
          echo "::error::Review dependency-bootstrap-review-${GITHUB_SHA}, commit only approved generated files, and remove ci/dependency-bootstrap-request."
          exit 1
      - name: Compile without warnings and verify architecture boundaries
        run: ./gradlew compileKotlin architectureTest verifyTestIsolationPolicy verifyCoverageExclusions verifySecurityDependencyVersions :build-logic:test --dependency-verification strict --no-daemon
      - name: Verify repository quality and documentation contracts
        run: |
          bash ci/quality-gate-contract-test.sh
          bash ci/local-offline-contract-test.sh
          bash docs/check-documentation.sh
          bash docker/deploy-contract-test.sh

  unit-coverage:
    name: 2. Unit + coverage
    needs: compile-architecture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
      - name: Run unit tests and enforce coverage thresholds
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --dependency-verification strict --no-daemon
      - name: Publish unit and coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-coverage-${{ github.sha }}
          path: |
            **/build/reports/tests/test/**
            build/reports/jacoco/**
          if-no-files-found: warn
          retention-days: 14

  api-integration:
    name: 3. API integration
    needs: compile-architecture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
      - name: Run API integration tests in an isolated runner
        env:
          TESTCONTAINERS_REUSE_ENABLE: 'false'
        run: ./gradlew :infrastructure:common:verifyMigrations :infrastructure:common:integrationTest :apps:api:integrationTest --dependency-verification strict --no-daemon
      - name: Publish API integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-integration-${{ github.sha }}
          path: |
            infrastructure/common/build/reports/tests/integrationTest/**
            apps/api/build/reports/tests/integrationTest/**
          if-no-files-found: warn
          retention-days: 14

  batch-integration:
    name: 4. Batch integration
    needs: compile-architecture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
      - name: Run Batch integration tests in an isolated runner
        env:
          TESTCONTAINERS_REUSE_ENABLE: 'false'
        run: ./gradlew :apps:batch:integrationTest --dependency-verification strict --no-daemon
      - name: Publish Batch integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: batch-integration-${{ github.sha }}
          path: apps/batch/build/reports/tests/integrationTest/**
          if-no-files-found: warn
          retention-days: 14

  static-analysis:
    name: 5. ktlint + detekt
    needs: compile-architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache checksum-verified standalone tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .ci-tools/downloads
            .ci-tools/ktlint.jar
            .ci-tools/detekt-cli.jar
          key: quality-tools-${{ runner.os }}-${{ hashFiles('ci/quality-tools.lock') }}
      - name: Bootstrap standalone tools
        run: bash ci/bootstrap-quality-tools.sh --verify-checksums
      - name: ktlint
        run: java -jar .ci-tools/ktlint.jar '**/src/**/*.kt' '!**/build/**'
      - name: detekt
        run: >-
          java -jar .ci-tools/detekt-cli.jar
          --input apps,architecture-tests,domain,infrastructure,modules,supports
          --config config/detekt/detekt.yml
          --baseline config/detekt/baseline.xml
          --excludes '**/build/**,**/.gradle/**,**/node_modules/**'
          --report html:build/reports/detekt.html
          --report sarif:build/reports/detekt.sarif
      - name: Publish static-analysis evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-analysis-${{ github.sha }}
          path: build/reports/detekt.*
          if-no-files-found: warn
          retention-days: 14

  dependency-security:
    name: 6. Dependency + security scan
    needs: compile-architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web dependencies
        run: npm --prefix apps/web ci --include=optional
      - name: Lint web sources from the locked dependency graph
        run: npm --prefix apps/web run lint
      - name: Audit the complete web lockfile at high severity
        run: bash ci/run-npm-audit.sh

  docker-build:
    name: 7. Docker image build
    needs: compile-architecture
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Prepare immutable image archive directory
        run: mkdir -p "${RUNNER_TEMP}/docker-images"
      - name: Build API image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/docker-images/api.tar
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build Batch image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/batch/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/batch:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/docker-images/batch.tar
          cache-from: type=gha,scope=batch
          cache-to: type=gha,mode=max,scope=batch
      - name: Build Web image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/docker-images/web.tar
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Publish Docker image archives
        id: docker-archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-images-${{ github.sha }}
          path: ${{ runner.temp }}/docker-images/*.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Record Docker artifact provenance
        run: |
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "artifact_id=${{ steps.docker-archives.outputs.artifact-id }}"
          } >> "${GITHUB_STEP_SUMMARY}"
