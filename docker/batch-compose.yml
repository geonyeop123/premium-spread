services:
  batch:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/batch:${DEPLOY_SHA:?DEPLOY_SHA is required}
    container_name: premium-spread-batch
    environment:
      SPRING_PROFILES_ACTIVE: prd
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PWD: ${MYSQL_PWD:?MYSQL_PWD is required}
      REDIS_MASTER_HOST: redis-master
      REDIS_MASTER_PORT: 6379
      REDIS_REPLICA_1_HOST: redis-readonly
      REDIS_REPLICA_1_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:?EXCHANGE_RATE_API_KEY is required}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
      MANAGEMENT_ADDRESS: 0.0.0.0
      MANAGEMENT_PORT: 9081
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9081/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    restart: unless-stopped
    networks:
      - premium-spread

networks:
  premium-spread:
    external: true
    name: premium-spread
