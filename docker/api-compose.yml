services:
  api:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/api:${DEPLOY_SHA:?DEPLOY_SHA is required}
    container_name: premium-spread-api
    environment:
      SPRING_PROFILES_ACTIVE: prd
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PWD: ${MYSQL_PWD:?MYSQL_PWD is required}
      REDIS_MASTER_HOST: redis-master
      REDIS_MASTER_PORT: 6379
      REDIS_REPLICA_1_HOST: redis-readonly
      REDIS_REPLICA_1_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      JWT_ACCESS_TOKEN_EXPIRY_MS: ${JWT_ACCESS_TOKEN_EXPIRY_MS:?JWT_ACCESS_TOKEN_EXPIRY_MS is required}
      JWT_REFRESH_TOKEN_EXPIRY_MS: ${JWT_REFRESH_TOKEN_EXPIRY_MS:?JWT_REFRESH_TOKEN_EXPIRY_MS is required}
      JWT_CLOCK_SKEW_SECONDS: ${JWT_CLOCK_SKEW_SECONDS:?JWT_CLOCK_SKEW_SECONDS is required}
      AUTH_REFRESH_HMAC_KEY: ${AUTH_REFRESH_HMAC_KEY:?AUTH_REFRESH_HMAC_KEY is required}
      AUTH_CORS_ALLOWED_ORIGINS: ${AUTH_CORS_ALLOWED_ORIGINS:?AUTH_CORS_ALLOWED_ORIGINS is required}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      MIGRATION_V12_ALLOW_EMPTY: ${MIGRATION_V12_ALLOW_EMPTY:-false}
      MANAGEMENT_ADDRESS: 0.0.0.0
      MANAGEMENT_PORT: 9080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    restart: unless-stopped
    networks:
      - premium-spread

networks:
  premium-spread:
    external: true
    name: premium-spread
