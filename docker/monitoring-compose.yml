services:
  prometheus:
    image: prom/prometheus
    profiles: ["local"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - premium-spread

  grafana:
    image: grafana/grafana
    profiles: ["local"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      # admin/admin fallback은 loopback-bound local profile에서만 허용한다.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    networks:
      - premium-spread

networks:
  premium-spread:
    external: true
    name: premium-spread
