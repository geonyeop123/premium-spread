version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: premium-spread-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=application
      - MYSQL_PASSWORD=application
      - MYSQL_DATABASE=premiumspread
      - MYSQL_CHARACTER_SET=utf8mb4
      - MYSQL_COLLATE=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - premium-spread

  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --latency-monitor-threshold
      - "100"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    networks:
      - premium-spread

  redis-readonly:
    image: redis:7-alpine
    container_name: redis-readonly
    depends_on:
      redis-master:
        condition: service_healthy
    ports:
      - "6380:6379"
    volumes:
      - redis-readonly-data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --replicaof
      - redis-master
      - "6379"
      - --replica-read-only
      - "yes"
      - --latency-monitor-threshold
      - "100"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    networks:
      - premium-spread

volumes:
  mysql-data:
  redis-master-data:
  redis-readonly-data:

networks:
  premium-spread:
    driver: bridge
    name: premium-spread
