version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: premium-spread-api
    # JVM MaxRAMPercentage=75가 호스트(6GB) 전체가 아닌 이 한도 기준으로 힙을 잡도록 강제 (OOM 방지)
    mem_limit: ${API_MEM_LIMIT:-1536m}
    mem_reservation: 512m
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prd
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PWD: ${MYSQL_PWD}
      REDIS_MASTER_HOST: redis-master
      REDIS_MASTER_PORT: 6379
      REDIS_REPLICA_1_HOST: redis-readonly
      REDIS_REPLICA_1_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_TOKEN_EXPIRY_MS: ${JWT_ACCESS_TOKEN_EXPIRY_MS}
      JWT_REFRESH_TOKEN_EXPIRY_MS: ${JWT_REFRESH_TOKEN_EXPIRY_MS}
      JWT_CLOCK_SKEW_SECONDS: ${JWT_CLOCK_SKEW_SECONDS}
      MIGRATION_V12_ALLOW_EMPTY: ${MIGRATION_V12_ALLOW_EMPTY:-false}
    restart: unless-stopped
    networks:
      - premium-spread

  batch:
    build:
      context: ..
      dockerfile: apps/batch/Dockerfile
    container_name: premium-spread-batch
    mem_limit: ${BATCH_MEM_LIMIT:-1536m}
    mem_reservation: 512m
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prd
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PWD: ${MYSQL_PWD}
      REDIS_MASTER_HOST: redis-master
      REDIS_MASTER_PORT: 6379
      REDIS_REPLICA_1_HOST: redis-readonly
      REDIS_REPLICA_1_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
    restart: unless-stopped
    networks:
      - premium-spread

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: premium-spread-web
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    mem_reservation: 256m
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    networks:
      - premium-spread

  nginx:
    image: nginx:alpine
    container_name: premium-spread-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - premium-spread

networks:
  premium-spread:
    external: true
    name: premium-spread
